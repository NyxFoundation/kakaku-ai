name: weekly crawl

# 定期実行はローカルの systemd timer（毎週月曜 04:23 JST）が本番。
# ここで cron を持つと同じ月曜の朝に二重に走り、同じ snapshot 日付を
# 両方が commit して push が衝突する。よって手動起動のみにしてある。
# ローカルが長期間落ちるときの代役として使う。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "車種キーを絞る（スペース区切り、空なら全車種）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: |
          uv venv
          uv pip install -e .

      - name: crawl
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            uv run kakaku-ai -v crawl --only ${{ github.event.inputs.only }}
          else
            uv run kakaku-ai -v crawl
          fi

      - name: build xlsx
        run: uv run kakaku-ai -v excel

      - uses: actions/upload-artifact@v4
        with:
          name: souba-xlsx
          path: data/xlsx/*.xlsx

      - name: commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/xlsx data/auction_details.jsonl
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: snapshot $(date +%F)"
            git push
          fi

      # rclone のシークレットが入っているときだけ Drive にも上げる
      - name: upload to Google Drive
        if: ${{ env.RCLONE_CONFIG_GDRIVE_TOKEN != '' }}
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_CONFIG_GDRIVE_CLIENT_SECRET }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          uv run kakaku-ai -v upload
