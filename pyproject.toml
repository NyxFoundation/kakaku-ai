[project]
name = "kakaku-ai"
version = "0.1.0"
description = "中古車の相場・口コミ・故障情報を週次でスナップショットして時系列 xlsx を作る"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kakaku-ai = "kakaku_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakaku_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
