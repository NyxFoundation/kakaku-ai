# 2013年以降に流通しているトヨタのミニバン
#
# ここが全ソースの結節点。1 車種につき各サイトの ID を持たせて、収集側は
# この ID を引くだけにしてある。ID の採取方法は docs/crawl-research.md 参照。
#
#   yahoo_category   : ヤフオク!「中古車・新車 > トヨタ」配下のリーフカテゴリ ID
#                      （HV が別カテゴリになっている車種は複数指定して合算する）
#   carsensor_code   : https://www.carsensor.net/usedcar/souba/<code>/
#   kakaku_item_id   : https://kakaku.com/item/<id>/
#   minkara_slug     : https://minkara.carview.co.jp/car/toyota/<slug>/
#   jmty_category    : https://jmty.jp/all/car-toy/<g-id>（無い車種は jmty_keyword で検索）
#   jmty_keyword     : jmty に専用カテゴリが無い車種のキーワード
#   mlit_common_name : 国交省の「通称名」（不具合情報 API のキー。表記ゆれを列挙）
#   generations      : 世代。年式レンジと型式（リコール照合とグレード解釈に使う）

