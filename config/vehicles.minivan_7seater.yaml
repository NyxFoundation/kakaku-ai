# 全国で買える 7人乗りミニバン（トヨタ以外）
#
# grandchildrice/life#16 の条件が「全国 / ミニバン7人乗り / 支払総額200万円以内」に
# なったのを受けて、トヨタ以外の主要どころを足したもの。
# 列の意味は config/vehicles.toyota_minivan.yaml のヘッダを参照。
#
# 収録の基準:
#   * 3列シートで 7人乗りの設定があること
#   * 2013年式以降の個体が中古市場に流通していること
#   * ヤフオクの「中古車・新車」に車種カテゴリがあること（＝落札相場が取れる）
#
# 入れなかったもの:
#   ホンダ エリシオン（2013年に販売終了。落札 7件）、日産 ラフェスタ（同 11件）、
#   三菱 グランディス（2009年終了）— いずれも 2013年式以降がほぼ流通していない。

meta:
  maker: 各社
  maker_en: multi
  body_type: ミニバン
  model_year_from: 2013

vehicles:
  - key: stepwgn
    name: ステップワゴン
    name_en: Step WGN
    maker: ホンダ
    yahoo_category: [2084023046]
    carsensor_code: [HO_S003]
    kakaku_item_id: "70100210084"
    minkara_slug: step_wagon
    jmty_category: g-2342
    jmty_maker: hon
    mlit_common_name: [ステップワゴン, ステップワゴンスパーダ]
    generations:
      - code: RK系
        from: 2009-10
        to: 2015-04
        models: [DBA-RK1, DBA-RK2, DBA-RK5, DBA-RK6, DBA-RK7]
      - code: RP系
        from: 2015-04
        to: 2022-05
        models:
          [DBA-RP1, DBA-RP2, DBA-RP3, DBA-RP4, DAA-RP5, 6BA-RP1, 6BA-RP2, 6BA-RP3, 6BA-RP4, 6AA-RP5]
      - code: RP6系
        from: 2022-05
        to: null
        models: [6BA-RP6, 6BA-RP7, 6AA-RP8]

  - key: freed
    name: フリード
    # 2017年式から通報が急減
    model_year_from: 2017
    name_en: Freed
    maker: ホンダ
    yahoo_category: [2084243774]
    carsensor_code: [HO_S083, HO_S092]
    kakaku_item_id: "70100210664"
    minkara_slug: freed
    jmty_category: g-2347
    jmty_maker: hon
    mlit_common_name: [フリード, フリードハイブリッド, フリード＋]
    generations:
      - code: GB3系
        from: 2008-05
        to: 2016-09
        models: [DBA-GB3, DBA-GB4, DAA-GP3]
      - code: GB5系
        from: 2016-09
        to: 2024-06
        models: [DBA-GB5, DBA-GB6, DAA-GB7, DAA-GB8, 6BA-GB5, 6BA-GB6, 6AA-GB7, 6AA-GB8]
      - code: GT系
        from: 2024-06
        to: null
