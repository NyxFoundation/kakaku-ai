  - key: delica_d5
    name: デリカD:5
    name_en: Delica D5
    maker: 三菱
    yahoo_category: [2084231249]
    carsensor_code: [MI_S089]
    kakaku_item_id: "70100410131"
    minkara_slug: delica_d5
    # jmty の「デリカ」カテゴリは D:5 / D:2 / ミニ が同居するのでタイトルで絞る
    jmty_category: g-2389
    jmty_title_pattern: デリカ\s*[DＤ]\s*[:：]?\s*[5５]
    jmty_maker: mit
    # 国交省の主表記はコロン無しの「デリカＤ５」（205件）。コロン付きは 4件しかない
    mlit_common_name: [デリカＤ５, デリカＤ：５]
    generations:
